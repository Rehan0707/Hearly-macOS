<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="200" height="200" rx="44" fill="#070707"/>
  <defs>
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="45%">
      <stop offset="0%"  stop-color="#BAF72B" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#BAF72B" stop-opacity="0"/>
    </radialGradient>
    <filter id="barGlow" x="-80%" y="-20%" width="260%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="blur"/>
