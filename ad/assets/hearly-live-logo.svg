<svg width='200' height='200' viewBox='0 0 200 200' fill='none' xmlns='http://www.w3.org/2000/svg'><rect width='200' height='200' rx='44' fill='#070707'/><defs><!-- Soft ambient glow behind center bars --><radialGradient id='ambientGlow' cx='50%' cy='50%' r='45%'><stop offset='0%' stop-color='#BAF72B' stop-opacity='0.18'/><stop offset='100%' stop-color='#BAF72B' stop-opacity='0'/></radialGradient><!-- Per-bar glow filter --><filter id='barGlow' x='-80%' y='-20%' width='260%' height='140%'><feGaussianBlur in='SourceGraphic' stdDeviation='3.5' result='blur'/><feMerge><feMergeNode in='blur'/><feMergeNode in='SourceGraphic'/></feMerge></filter><filter id='barGlowStrong' x='-80%' y='-20%' width='260%' height='140%'><feGaussianBlur in='SourceGraphic' stdDeviation='6' result='blur'/><feMerge><feMergeNode in='blur'/><feMergeNode in='blur'/><feMergeNode in='SourceGraphic'/></feMerge></filter></defs><!-- Ambient green glow in center --><ellipse cx='100' cy='100' rx='60' ry='70' fill='url(#ambientGlow)'/><!-- 11 bars, uniform: width=12, gap=5, pitch=17 Total span = 11*12 + 10*5 = 182, startX = 9 Bar left edges: 9, 26, 43, 60, 77, 94, 111, 128, 145, 162, 179 All bars vertically centered at y=100 --><!-- Bar 0 & 10 — outermost, tiny, very dark --><rect x='9' y='93' width='12' height='14' rx='6' fill='#192309' opacity='0.5'/><rect x='179' y='93' width='12' height='14' rx='6' fill='#192309' opacity='0.5'/><!-- Bar 1 & 9 — short, dark olive --><rect x='26' y='85' width='12' height='30' rx='6' fill='#2b3e0d' opacity='0.65'/><rect x='162' y='85' width='12' height='30' rx='6' fill='#2b3e0d' opacity='0.65'/><!-- Bar 2 & 8 — medium, mid green --><rect x='43' y='73' width='12' height='54' rx='6' fill='#3f6514'/><rect x='145' y='73' width='12' height='54' rx='6' fill='#3f6514'/><!-- Bar 3 & 7 — taller, brighter green --><rect x='60' y='58' width='12' height='84' rx='6' fill='#5f9a1c' filter='url(#barGlow)'/><rect x='128' y='58' width='12' height='84' rx='6' fill='#5f9a1c' filter='url(#barGlow)'/><!-- Bar 4 & 6 — tall, lime --><rect x='77' y='43' width='12' height='114' rx='6' fill='#8bcc25' filter='url(#barGlow)'/><rect x='111' y='43' width='12' height='114' rx='6' fill='#8bcc25' filter='url(#barGlow)'/><!-- Bar 5 — center, tallest, brightest with strong glow --><rect x='94' y='31' width='12' height='138' rx='6' fill='#BAF72B' filter='url(#barGlowStrong)'/></svg>